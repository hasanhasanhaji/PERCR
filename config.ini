[MODEL]
# Word embedding dimensionality for custom
embed_dim = 400
# Hidden dimension of the LSTM layer (typically half or equal to embed_dim)
hidden_dim = 200
# Encoder type === can choose between ['lstm','HooshvareLab/bert-fa-zwnj-base']
encoder_type = lstm

[TRAINING]
# Number of epochs to train for (recommended range: 10-100)
epochs = 50
# Number of documents per batch (affects memory usage and training speed)
batch_size = 5
# Maximum sentences per document (for LSTM only, helps control memory usage)
max_sentences_per_doc = 50
 # Number of steps between evaluations on the development set
steps = 10

[DATA]
# Path to the training corpus (should be split into train and dev) (For Mehr and RCDAT
train_corpus_path = data/Mehr/train-dev/
# Path to the test corpus (used for final evaluation)  (For Mehr and RCDAT)
test_corpus_path = data/Mehr/test/